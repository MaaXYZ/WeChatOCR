name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            cmake_args: ""
          - os: windows-2022
            platform: windows-x64
            cmake_args: "-A x64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix stage
      - name: Build installed C package consumer
        run: cmake -S tests/package_consumer -B build-consumer -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/stage" ${{ matrix.cmake_args }}
      - name: Link installed C package consumer
        run: cmake --build build-consumer --config Release --parallel
      - name: Test installed C package consumer
        run: ctest --test-dir build-consumer -C Release --output-on-failure
      - name: Upload installed SDK
        uses: actions/upload-artifact@v4
        with:
          name: WeChatOCR-${{ matrix.platform }}-${{ github.sha }}
          path: stage/
          if-no-files-found: error
